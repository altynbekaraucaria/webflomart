# Rebuilds the SEO section pages (/rozy/, /piony/ ...) and the per-product
# pages (/buket/<id>/ ...) from the live Firestore catalog, plus sitemap.xml.
# Runs every 3 hours, on every push to main that touches the generator, and on
# demand (Actions → "Build catalog pages" → Run workflow). index.html is never
# changed by this workflow.
name: Build catalog pages

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'assets/flomart-catalog.js'
      - '.github/workflows/build-pages.yml'

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build pages from Firestore
        run: node tools/build-pages.js
      - name: Commit changes
        run: |
          git config user.name "flomart-pages-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No catalog changes."
          else
            git commit -m "Обновление страниц каталога из админки"
            git push
          fi
